<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>PDF Viewer</title>
  <link rel="icon" type="image/png" href="./mikankame.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: #f5f5f5;
    }

    header {
      background: #1a73e8;
      color: white;
      padding: 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      position: relative;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 600;
    }

    #uploadControls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }

    #fileInput {
      color: white;
    }

    #status {
      font-size: 0.95rem;
      opacity: 0.9;
    }

    #headerDropZone {
      border: 2px dashed rgba(255, 255, 255, 0.4);
      border-radius: 12px;
      padding: 1.25rem;
      text-align: center;
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.85);
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    #headerDropZone.is-active {
      border-color: #fff;
      background-color: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .is-hidden {
      display: none !important;
    }

    main {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    #viewerFrame {
      width: 100%;
      border: none;
      flex: 1;
      min-height: 0;
    }
    @keyframes mascotSlideAcross {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(calc(100vw - 100% - 32px));
      }
    }

    #mascot {
      position: fixed;
      left: 16px;
      bottom: 16px;
      width: min(140px, 25vw);
      max-width: 40vw;
      opacity: 0;
      pointer-events: none;
      transform: translateX(0);
      transition: opacity 0.2s ease;
      z-index: 10;
    }

    #mascot.is-animating {
      animation: mascotSlideAcross var(--mascot-duration, 6s) ease-in-out forwards;
      opacity: 1;
    }
  </style>
</head>
<body>
  <header>
    <h1>PDF表示</h1>
    <div id="uploadControls">
      <label for="fileInput">PDFファイルをアップロードして表示:</label>
      <input id="fileInput" type="file" accept="application/pdf">
    </div>
    <div id="headerDropZone">青いヘッダーの空いている場所にPDFをドラッグ＆ドロップできます。</div>
    <div id="status">サンプルPDFを表示しています。</div>
  </header>
  <main>
    <iframe id="viewerFrame" title="PDF viewer"></iframe>
  </main>
  <img id="mascot" src="./mikankame.png" alt="みかんとカメのイラスト">

  <script>
    const DEFAULT_PDF = './pdffileviewer.pdf';
    const MASCOT_ANIMATION_DURATION_MS = 8000;
    const viewerFrame = document.getElementById('viewerFrame');
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const header = document.querySelector('header');
    const headerDropZone = document.getElementById('headerDropZone');
    const mascot = document.getElementById('mascot');

    let currentObjectUrl = null;
    let dropZoneDepth = 0;

    function setViewerSource(url, description) {
      const viewerUrl = `./web/viewer.html?file=${encodeURIComponent(url)}#toolbar=0`;
      viewerFrame.src = viewerUrl;
      status.textContent = description;
      playMascotAnimation();
    }

    function playMascotAnimation() {
      if (!mascot) {
        return;
      }

      mascot.style.setProperty('--mascot-duration', `${MASCOT_ANIMATION_DURATION_MS}ms`);
      mascot.classList.remove('is-animating');
      // Force reflow so that removing the class allows the animation to restart.
      void mascot.offsetWidth;
      mascot.classList.add('is-animating');
    }

    function loadPdfFile(file) {
      if (!file) {
        return;
      }

      resetObjectUrl();
      currentObjectUrl = URL.createObjectURL(file);
      setViewerSource(currentObjectUrl, `${file.name} を表示しています。`);
      header.classList.add('is-hidden');
    }

    function resetObjectUrl() {
      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = null;
      }
    }

    function isPdfFile(file) {
      return file && (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf'));
    }

    function isFileDrag(event) {
      return Boolean(event.dataTransfer && Array.from(event.dataTransfer.types).includes('Files'));
    }

    function isInUploadControls(event) {
      return event.composedPath().some(
        (element) => element instanceof HTMLElement && element.id === 'uploadControls',
      );
    }

    function activateDropZone() {
      headerDropZone.classList.add('is-active');
    }

    function deactivateDropZone() {
      dropZoneDepth = 0;
      headerDropZone.classList.remove('is-active');
    }

    fileInput.addEventListener('change', () => {
      const [file] = fileInput.files;
      if (!isPdfFile(file)) {
        status.textContent = 'PDFファイルを選択してください。';
        return;
      }

      loadPdfFile(file);
    });

    header.addEventListener('dragenter', (event) => {
      if (!isFileDrag(event) || isInUploadControls(event)) {
        return;
      }

      dropZoneDepth += 1;
      event.preventDefault();
      activateDropZone();
    });

    header.addEventListener('dragover', (event) => {
      if (!isFileDrag(event) || isInUploadControls(event)) {
        return;
      }

      event.preventDefault();
      event.dataTransfer.dropEffect = 'copy';
      activateDropZone();
    });

    header.addEventListener('dragleave', (event) => {
      if (!isFileDrag(event) || isInUploadControls(event)) {
        return;
      }

      dropZoneDepth = Math.max(dropZoneDepth - 1, 0);
      if (dropZoneDepth === 0) {
        deactivateDropZone();
      }
    });

    header.addEventListener('drop', (event) => {
      if (isInUploadControls(event) || !event.dataTransfer) {
        return;
      }

      event.preventDefault();
      deactivateDropZone();

      const pdfFile = Array.from(event.dataTransfer.files).find(isPdfFile);
      if (!pdfFile) {
        status.textContent = 'PDFファイルをドロップしてください。';
        return;
      }

      loadPdfFile(pdfFile);
    });

    window.addEventListener('beforeunload', resetObjectUrl);

    setViewerSource(DEFAULT_PDF, 'サンプルPDFを表示しています。');
  </script>
</body>
</html>
