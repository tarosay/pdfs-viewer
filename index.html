<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>PDF Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: #f5f5f5;
    }

    header {
      background: #1a73e8;
      color: white;
      padding: 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    header.is-hidden {
      display: none;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 600;
    }

    #uploadControls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }

    #fileInput {
      color: white;
    }

    #status {
      font-size: 0.95rem;
      opacity: 0.9;
    }

    main {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    #viewerFrame {
      width: 100%;
      border: none;
      flex: 1;
      min-height: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>PDF表示</h1>
    <div id="uploadControls">
      <label for="fileInput">PDFファイルをアップロードして表示:</label>
      <input id="fileInput" type="file" accept="application/pdf">
    </div>
    <div id="status">サンプルPDFを表示しています。</div>
  </header>
  <main>
    <iframe id="viewerFrame" title="PDF viewer"></iframe>
  </main>

  <script>
    const DEFAULT_PDF = './AIでテーマソング.pdf';
    const viewerFrame = document.getElementById('viewerFrame');
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const header = document.querySelector('header');

    const STATUS_MESSAGES = {
      default: 'サンプルPDFを表示しています。',
      invalidFile: 'PDFファイルを選択してください。',
      reloadHint: '別のPDFを表示するにはページを再読み込みしてください。'
    };

    let currentObjectUrl = null;

    function setViewerSource(url) {
      const viewerUrl = `./web/viewer.html?file=${encodeURIComponent(url)}`;
      viewerFrame.src = viewerUrl;
    }

    function updateStatus(text) {
      status.textContent = text;
    }

    function showDefaultPdf() {
      setViewerSource(DEFAULT_PDF);
      updateStatus(STATUS_MESSAGES.default);
      header.classList.remove('is-hidden');
    }

    function resetObjectUrl() {
      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = null;
      }
    }

    function isPdfFile(file) {
      if (!file) {
        return false;
      }

      if (file.type === 'application/pdf') {
        return true;
      }

      return file.name?.toLowerCase().endsWith('.pdf');
    }

    fileInput.addEventListener('change', () => {
      const [file] = fileInput.files;
      if (!file) {
        return;
      }

      if (!isPdfFile(file)) {
        updateStatus(STATUS_MESSAGES.invalidFile);
        header.classList.remove('is-hidden');
        fileInput.value = '';
        return;
      }

      resetObjectUrl();
      currentObjectUrl = URL.createObjectURL(file);
      setViewerSource(currentObjectUrl);
      updateStatus(`${file.name} を表示しています。${STATUS_MESSAGES.reloadHint}`);
      header.classList.add('is-hidden');
    });

    window.addEventListener('beforeunload', resetObjectUrl);

    showDefaultPdf();
  </script>
</body>
</html>
